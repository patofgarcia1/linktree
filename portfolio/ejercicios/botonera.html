  <main>
    <section class="seccion">
  <h2>🎵 Botonera de Sonidos Musicales</h2>
  <div class="cards botonera">
    <button class="card" onclick="reproducirSonido('sonidos/acordeon.mp3')">
      <img src="../img/acordeon.jpg" alt="Acordeon" class="img-proyecto">
      Acordeon
    </button>
    <button class="card" onclick="reproducirSonido('sonidos/bongo.mp3')">
      <img src="../img/bongo.jpg" alt="Bongo" class="img-proyecto">
      Bongo
    </button>
    <button class="card" onclick="reproducirSonido('sonidos/flauta.mp3')">
      <img src="../img/flauta.jpg" alt="Flauta" class="img-proyecto">
      Flauta
    </button>
    <button class="card" onclick="reproducirSonido('sonidos/guiro.mp3')">
      <img src="../img/guiro.jpg" alt="Guiro" class="img-proyecto">
      Guiro
    </button>
    <button class="card" onclick="reproducirSonido('sonidos/guitarra.mp3')">
      <img src="../img/guitarra.jpg" alt="Guitarra" class="img-proyecto">
      Guitarra

      <img src="../img/piano.jpg" alt="Piano" class="img-proyecto">
      Piano

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const logo = document.querySelector('.logo-nombre');
      sidebar.classList.toggle('active');
      logo.classList.toggle('hide-logo');
    }

    function reproducirSonido(archivo) {
      const audio = new Audio(archivo);
      audio.play();
    }
  </script>
